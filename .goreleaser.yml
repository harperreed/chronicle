# ABOUTME: Configures Chronicle's cross-platform release archives and publishing metadata.
# ABOUTME: Publishes release artifacts and a Homebrew cask through GoReleaser.
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: .
    binary: chronicle
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README*
      - docs/*

release:
  github:
    owner: harperreed
    name: chronicle

homebrew_casks:
  - repository:
      owner: harperreed
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/harperreed/chronicle"
    description: "Timestamped logging tool with SQLite and optional project log files"
    license: "MIT"
    binaries:
      - chronicle

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

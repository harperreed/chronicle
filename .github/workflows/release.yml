# ABOUTME: Builds Chronicle release binaries for supported macOS and Linux architectures.
# ABOUTME: Publishes tagged archives and updates the project Homebrew tap.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-darwin:
    name: Build (darwin)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build darwin/amd64
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags="-s -w" -o chronicle-darwin-amd64 .

      - name: Build darwin/arm64
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags="-s -w" -o chronicle-darwin-arm64 .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-darwin
          path: chronicle-darwin-*
          retention-days: 1

  build-linux:
    name: Build (linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build linux/amd64
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags="-s -w" -o chronicle-linux-amd64 .

      - name: Build linux/arm64
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: arm64
          CC: aarch64-linux-gnu-gcc
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          go build -trimpath -ldflags="-s -w" -o chronicle-linux-arm64 .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux
          path: chronicle-linux-*
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-darwin, build-linux]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download darwin binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-darwin
          path: dist/

      - name: Download linux binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux
          path: dist/

      - name: Create archives
        run: |
          if ! cd dist; then
            exit 1
          fi
          for bin in chronicle-*; do
            chmod +x "$bin"
            tar -czvf "${bin}.tar.gz" "$bin"
          done
          ls -la

      - name: Validate release inputs
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          : "${HOMEBREW_TAP_TOKEN:?HOMEBREW_TAP_TOKEN is required}"
          : "${TAG_NAME:?TAG_NAME is required}"
          CORE_NUMBER='(0|[1-9][0-9]*)'
          PRERELEASE_IDENTIFIER='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          BUILD_IDENTIFIER='[0-9A-Za-z-]+'
          SEMVER_PATTERN="^v${CORE_NUMBER}\.${CORE_NUMBER}\.${CORE_NUMBER}(-${PRERELEASE_IDENTIFIER}(\.${PRERELEASE_IDENTIFIER})*)?(\+${BUILD_IDENTIFIER}(\.${BUILD_IDENTIFIER})*)?$"
          if [[ ! "$TAG_NAME" =~ $SEMVER_PATTERN ]]; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes \
            dist/*.tar.gz

      - name: Update Homebrew Tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          : "${HOMEBREW_TAP_TOKEN:?HOMEBREW_TAP_TOKEN is required}"
          : "${TAG_NAME:?TAG_NAME is required}"

          VERSION=${TAG_NAME#v}
          ARM_SHA256=$(sha256sum dist/chronicle-darwin-arm64.tar.gz | cut -d' ' -f1)
          INTEL_SHA256=$(sha256sum dist/chronicle-darwin-amd64.tar.gz | cut -d' ' -f1)

          echo "Version: $VERSION"
          echo "ARM SHA256: $ARM_SHA256"
          echo "Intel SHA256: $INTEL_SHA256"

          export GH_TOKEN="$HOMEBREW_TAP_TOKEN"
          gh auth setup-git
          gh repo clone harperreed/homebrew-tap tap
          if ! cd tap; then
            exit 1
          fi
          mkdir -p Casks

          cat > Casks/chronicle.rb << EOF
          cask "chronicle" do
            arch arm: "arm64", intel: "amd64"

            version "$VERSION"
            sha256 arm:   "$ARM_SHA256",
                   intel: "$INTEL_SHA256"

            url "https://github.com/harperreed/chronicle/releases/download/v#{version}/chronicle-darwin-#{arch}.tar.gz"
            name "Chronicle"
            desc "Timestamped logging tool with SQLite and optional project log files"
            homepage "https://github.com/harperreed/chronicle"

            binary "chronicle-darwin-#{arch}", target: "chronicle"
          end
          EOF

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Casks/chronicle.rb
          git commit -m "Update chronicle to $VERSION"
          git push
